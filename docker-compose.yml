services:
  db:
    image: pgvector/pgvector:pg17
    container_name: ai_swe_postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_swe_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_swe_password}
      POSTGRES_DB: ${POSTGRES_DB:-ai_swe_db}
    volumes:
      - ai_swe_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_swe_user} -d ${POSTGRES_DB:-ai_swe_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai_swe_redis
    ports:
      - "6379:6379"
    volumes:
      - ai_swe_redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: ai_swe_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-ai_swe_user}:${POSTGRES_PASSWORD:-ai_swe_password}@db:5432/${POSTGRES_DB:-ai_swe_db}}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key_here}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost/api/v1/accounts/auth/github/callback}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      WORKSPACES_ROOT: /app/workspaces
      AGENT_STEP_TIMEOUT_SECONDS: 600
    volumes:
      - ai_swe_workspaces:/app/workspaces
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ""
    container_name: ai_swe_web
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: ai_swe_caddy
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ai_swe_caddy_data:/data
      - ai_swe_caddy_config:/config

volumes:
  ai_swe_postgres_data:
  ai_swe_redis_data:
  ai_swe_workspaces:
  ai_swe_caddy_data:
  ai_swe_caddy_config:
